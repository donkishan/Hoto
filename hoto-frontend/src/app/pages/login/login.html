<div class="auth-box d-flex align-items-center">
    <div class="container-xxl">
        <div class="row align-items-center justify-content-center">
            <div class="col-xl-10">
                <div class="card rounded-4">
                    <div class="row justify-content-between g-0">
                        <div class="col-lg-6">
                            <div class="card-body">
                                <div class="auth-brand text-center mb-4">
                                    <a routerLink="/" class="logo-dark">
                                        <img src="images/logo-black.png" alt="dark logo" height="32">
                                    </a>
                                    <a routerLink="/" class="logo-light">
                                        <img src="images/logo.png" alt="logo" height="32">
                                    </a>
                                    <h4 class="fw-bold mt-4">Welcome to HOTO</h4>
                                    <p class="text-muted w-lg-75 mx-auto">TEST</p>
                                </div>

                                <form (ngSubmit)="getLogin()" #loginForm="ngForm">
                                    <div class="mb-3">
                                        <label for="userEmail" class="form-label">Email address <span
                                                class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i
                                                    class="ti ti-mail text-muted fs-xl"></i></span>
                                            <input type="email" name="email" [(ngModel)]="username" required email
                                                [ngClass]="{
                                                            'form-control': true,
                                                            'is-invalid': emailRef.invalid && emailRef.touched
                                                    }" placeholder="you@example.com" #emailRef="ngModel">
                                            <div *ngIf="emailRef.invalid && emailRef.touched" class="invalid-feedback">
                                                Valid email is required.
                                            </div>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="userPassword" class="form-label">Password <span
                                                class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i
                                                    class="ti ti-lock-password text-muted fs-xl"></i></span>
                                            <input type="password" [ngClass]="{
                                                            'form-control': true,
                                                            'is-invalid': pwdRef.invalid && pwdRef.touched
                                                    }" name="password" [(ngModel)]="password" placeholder="••••••••"
                                                required minlength="8" placeholder="Password" #pwdRef="ngModel">
                                            <div *ngIf="pwdRef.invalid && pwdRef.touched" class="invalid-feedback">
                                                Password must be at least 8 characters.
                                            </div>

                                        </div>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <a routerLink="/forgot-password"
                                            class="text-decoration-underline link-offset-3 text-muted">Forgot
                                            Password?</a>
                                    </div>
                                    <div *ngIf="loginFailed" class="alert alert-warning" role="alert">
                                        ⚠️ Warning! Login failed. Please double-check your inputs.
                                    </div>

                                    <div class="d-grid">
                                        <button type="submit" [disabled]="loginForm.invalid"
                                            class="btn btn-primary fw-semibold py-2">Sign In</button>
                                    </div>
                                </form>
                                <p class="text-center text-muted mt-4 mb-0">
                                    © 2024 - {{ currentYear }} Pro-TEAM Solutions Pvt. Ltd.
                                </p>
                            </div>
                        </div>

                        <div class="col-lg-6 d-none d-lg-block">
                            <div
                                class="h-100 position-relative card-side-img rounded-end-4 rounded-end rounded-0 overflow-hidden">
                                <div
                                    class="p-4 card-img-overlay rounded-4 rounded-start-0 auth-overlay d-flex align-items-end justify-content-center">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
